<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pelican Bike Ride</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 700px at 50% 40%, #3b4a58 0%, #26323d 55%, #1c2730 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, sans-serif;
  }
  .frame {
    width: min(100vw, calc(100vh * 16 / 9));
    filter: drop-shadow(0 24px 50px rgba(0,0,0,.45));
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 6px;
  }
  .skyGrad { stop-color: #7cc3ea; }
  .skyMid  { stop-color: #c6e8f3; }
  .skyBot  { stop-color: #fdeec7; }

  .parallax { animation: scrollx linear infinite; will-change: transform; }
  .far       { animation-duration: 36s; }
  .mid       { animation-duration: 16s; }
  .road       { animation-duration: 6.6s; }
  .drift  { animation: drift ease-in-out infinite alternate; }
  .cloudA { animation-duration: 9s; }
  .cloudB { animation-duration: 13s; }
  .rays  { transform-origin: 1065px 118px; animation: spinspin linear infinite; animation-duration: 40s; }
  .blades { transform-origin: 178px 560px; animation: spinspin linear infinite; animation-duration: 3.4s; }
  .dust { opacity: 0; animation: dust 2.4s linear infinite; }
  .d1 { animation-duration: 2.1s; }
  .d2 { animation-duration: 2.6s; animation-delay: .9s; }
  .d3 { animation-duration: 2.3s; animation-delay: 1.6s; }
  .spark { transform-origin: 400px 210px; animation: glow ease-in-out infinite alternate; animation-duration: 1.8s; }

  @keyframes scrollx { to { transform: translateX(-1200px); } }
  @keyframes drift   { to { transform: translateX(-70px); } }
  @keyframes spinspin { to { transform: rotate(360deg); } }
  @keyframes dust {
    0%   { opacity: 0;  transform: translate(0, 0) scale(.6); }
    18%  { opacity: .8; }
    100% { opacity: 0;  transform: translate(-52px, -30px) scale(1.25); }
  }
  @keyframes glow {
    from { opacity: .55; }
    to   { opacity: 1; }
  }
</style>
</head>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var DEG = Math.PI / 180;
  var O = { x: 602, y: 483 };
  var HIP = { x: 577, y: 344 };
  var R = 30, Lt = 86, Ls = 90;
  var OMG = 2.15;
  var rear = $("rotRear"), front = $("rotFront");
  var crank = $("crank"), pedalF = $("pedalF"), pedalB = $("pedalB");
  var footF = $("footF"), footB = $("footB");
  var torso = $("torso"), pouch = $("pouch"), scarf = $("scarf");
  var wingB = $("wingBack"), wingF = $("wingFront");
  var tf = $("thighF"), sf = $("shinF"), kf = $("kneeF");
  var tb = $("thighB"), sb = $("shinB"), kb = $("kneeB");

  function solve(fx, fy) {
    var dx = fx - HIP.x, dy = fy - HIP.y;
    var d = Math.hypot(dx, dy);
    d = Math.max(Math.abs(Lt - Ls), Math.min(Lt + Ls, d));
    var a0 = Math.atan2(dy, dx);
    var cth = (d * d + Lt * Lt - Ls * Ls) / (2 * d * Lt);
    var th = Math.acos(Math.max(-1, Math.min(1, cth)));
    var kp = { x: HIP.x + Lt * Math.cos(a0 + th), y: HIP.y + Lt * Math.sin(a0 + th) };
    var km = { x: HIP.x + Lt * Math.cos(a0 - th), y: HIP.y + Lt * Math.sin(a0 - th) };
    return kp.x > km.x ? kp : km;
  }

  function setLeg(t, s, k, fx, fy, K) {
    t.setAttribute("x1", HIP.x); t.setAttribute("y1", HIP.y);
    t.setAttribute("x2", K.x);   t.setAttribute("y2", K.y);
    s.setAttribute("x1", K.x);   s.setAttribute("y1", K.y);
    s.setAttribute("x2", fx);    s.setAttribute("y2", fy);
    k.setAttribute("cx", K.x);   k.setAttribute("cy", K.y);
  }

  function frame(now) {
    var s = now / 1000;
    var a = -90 * DEG + OMG * s;
    var wheelDeg = OMG * s * (180 / Math.PI);
    var fFx = O.x + R * Math.cos(a), fFy = O.y + R * Math.sin(a);
    var bFx = O.x + R * Math.cos(a + Math.PI), bFy = O.y + R * Math.sin(a + Math.PI);

    rear.setAttribute("transform", "rotate(" + wheelDeg + " 445 480)");
    front.setAttribute("transform", "rotate(" + wheelDeg + " 755 480)");
    crank.setAttribute("transform", "rotate(" + (a / DEG) + " 602 483)");

    pedalF.setAttribute("transform", "translate(" + fFx + " " + fFy + ")");
    pedalB.setAttribute("transform", "translate(" + bFx + " " + bFy + ")");
    footF.setAttribute("transform", "translate(" + fFx + " " + fFy + ")");
    footB.setAttribute("transform", "translate(" + bFx + " " + bFy + ") scale(0.92)");

    setLeg(tf, sf, kf, fFx, fFy, solve(fFx, fFy));
    setLeg(tb, sb, kb, bFx, bFy, solve(bFx, bFy));

    torso.setAttribute("transform", "rotate(" + (2.6 * Math.sin(a)) + " 577 344)");
    pouch.setAttribute("transform", "rotate(" + (9 * Math.sin(a) + 2 * Math.sin(3 * s * 7.2 + 1.4)) + " 620 202)");
    scarf.setAttribute("transform", "rotate(" + (4.5 * Math.sin(s * 8.5) + 2.5 * Math.sin(s * 15.3)) + " 606 258)");
    wingB.setAttribute("transform", "rotate(" + (7 * Math.sin(s * 9) + 4 * Math.sin(s * 17.7)) + " 542 288)");
    wingF.setAttribute("transform", "rotate(" + (1.4 * Math.sin(s * 10.2)) + " 612 292)");

    requestAnimationFrame(frame);
  }
  document.addEventListener("visibilitychange", function () { /* keep running */ });
  requestAnimationFrame(frame);
})();
</script>
